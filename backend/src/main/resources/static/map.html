<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>附近活动</title>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #message {
      box-sizing: border-box;
      padding: 24px;
      color: #4b5563;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
<div id="map"><div id="message">地图加载中…</div></div>
<script>
  function queryParameters() {
    return Object.fromEntries(new URLSearchParams(window.location.search).entries());
  }

  function showMessage(message) {
    document.getElementById('map').innerHTML = `<div id="message">${message}</div>`;
  }

  function loadHuaweiMapSdk() {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://mapapi.cloud.huawei.com/mapjs/v1/mapkit.js';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  async function initialize() {
    const configResponse = await fetch('/map/config').then(response => response.json());
    const config = configResponse.obj || {};
    if (!config.accessToken) {
      showMessage('未配置 HMS_MAP_ACCESS_TOKEN，暂时无法加载华为地图。');
      return;
    }

    await loadHuaweiMapSdk();
    const parameters = queryParameters();
    const lat = Number(parameters.lat);
    const lng = Number(parameters.lng);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
      showMessage('当前位置参数无效。');
      return;
    }

    const map = new HWMapJsSDK.HWMap(document.getElementById('map'), {
      center: {lat, lng},
      zoom: 14,
      language: 'zh-cn',
      sourceType: 'raster',
      zoomControl: true,
      locationControl: true,
      authOptions: {accessToken: config.accessToken}
    });

    const nearbyResponse = await fetch(
      `/event/nearbyList?targetLat=${lat}&targetLont=${lng}&distance=0.1`
    ).then(response => response.json());
    if (!nearbyResponse.success || !Array.isArray(nearbyResponse.obj)) {
      return;
    }
    nearbyResponse.obj.forEach(event => {
      if (!Number.isFinite(Number(event.lat)) || !Number.isFinite(Number(event.lon))) {
        return;
      }
      const marker = new HWMapJsSDK.HWMarker({
        map,
        position: {lat: Number(event.lat), lng: Number(event.lon)},
        zIndex: 10,
        label: {text: event.name || '活动', fontSize: '16px'}
      });
      marker.addListener('click', () => {
        window.location.href = `event://${event.id}`;
      });
    });
  }

  initialize().catch(() => showMessage('地图加载失败，请检查网络或华为地图配置。'));
</script>
</body>
</html>
