server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: iteam-harmonyos-back
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/iteam01?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    default-property-inclusion: always

app:
  upload-directory: ${UPLOAD_DIRECTORY:upload}
  hms-map-api-key: ${HMS_MAP_API_KEY:}
  hms-map-access-token: ${HMS_MAP_ACCESS_TOKEN:}
